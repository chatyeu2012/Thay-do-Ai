<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut AI Photo Editor - Trình Chỉnh Sửa Ảnh AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121214; color: #ffffff; }
        .canvas-container { position: relative; display: inline-block; }
        canvas { border-radius: 12px; cursor: crosshair; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-4xl bg-[#1e1e22] rounded-2xl p-6 border border-gray-800 shadow-2xl">
        <!-- Header CapCut -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-4 mb-4">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-cyan-400 rounded-md flex items-center justify-center text-black font-bold text-sm">CC</div>
                <h1 class="text-lg font-bold">Trình Chỉnh Sửa Ảnh Bằng AI (CapCut AI Photo Editor)</h1>
            </div>
            <span class="text-xs bg-gray-800 text-cyan-400 px-3 py-1 rounded-full">Inpainting Mode</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Cột chỉnh sửa & Canvas -->
            <div class="md:col-span-2 flex flex-col items-center">
                <!-- Vùng tải ảnh / Canvas vẽ mask -->
                <div id="uploadBox" class="w-full h-80 border-2 border-dashed border-gray-700 hover:border-cyan-400 rounded-xl flex flex-col items-center justify-center cursor-pointer p-4 transition" onclick="document.getElementById('imgInput').click()">
                    <svg class="w-12 h-12 text-gray-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <p class="text-sm text-gray-400">Bấm để tải ảnh cần sửa trang phục lên</p>
                </div>
                <input type="file" id="imgInput" accept="image/*" class="hidden" onchange="loadImage(this)">

                <!-- Khung Canvas khi đã tải ảnh -->
                <div id="editorArea" class="hidden flex-col items-center w-full">
                    <div class="text-xs text-gray-400 mb-2">🖊️ Dùng chuột/ngón tay bôi kín phần quần áo bạn muốn AI thay đổi</div>
                    <div class="canvas-container max-w-full overflow-hidden">
                        <canvas id="mainCanvas"></canvas>
                    </div>
                    <button onclick="clearMask()" class="mt-2 text-xs text-red-400 underline">Xóa vùng đã bôi (Làm lại)</button>
                </div>
            </div>

            <!-- Cột bảng điều khiển AI -->
            <div class="space-y-4 bg-[#141416] p-4 rounded-xl border border-gray-800 flex flex-col justify-between">
                <div>
                    <label class="block text-xs font-semibold mb-2 text-gray-300">1. Kích thước cọ bôi vùng chọn</label>
                    <input type="range" id="brushSize" min="5" max="50" value="20" class="w-full accent-cyan-400 mb-4">

                    <label class="block text-xs font-semibold mb-2 text-gray-300">2. Bạn muốn thay thành trang phục gì?</label>
                    <textarea id="promptInput" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none text-white" placeholder="Ví dụ: Áo sơ mi trắng công sở, Áo vest nam màu đen, Váy hoa mùa hè..."></textarea>
                </div>

                <div>
                    <button id="generateBtn" onclick="runAIEditor()" class="w-full bg-cyan-400 hover:bg-cyan-300 text-black font-bold py-3 rounded-xl transition shadow-lg shadow-cyan-500/20">
                        ✨ Tạo trang phục mới
                    </button>
                    <div id="statusText" class="text-xs text-center text-gray-400 mt-2 min-h-[16px]"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script tương tác Canvas và gọi API AI Inpainting -->
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";

        let canvas = document.getElementById('mainCanvas');
        let ctx = canvas.getContext('2d');
        let isDrawing = false;
        let originalImage = null;

        // Xử lý tải ảnh lên Canvas
        window.loadImage = function(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    document.getElementById('uploadBox').classList.add('hidden');
                    document.getElementById('editorArea').classList.remove('hidden');
                    document.getElementById('editorArea').classList.add('flex');

                    // Resize canvas vừa khung
                    const maxWidth = 450;
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    initDrawing();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // Vẽ lớp bôi đen (Mask)
        function initDrawing() {
            canvas.onmousedown = (e) => { isDrawing = true; draw(e); };
            canvas.onmousemove = (e) => { if (isDrawing) draw(e); };
            canvas.onmouseup = () => { isDrawing = false; ctx.beginPath(); };
            
            // Hỗ trợ cảm ứng điện thoại
            canvas.ontouchstart = (e) => { isDrawing = true; drawTouch(e); };
            canvas.ontouchmove = (e) => { if (isDrawing) drawTouch(e); };
            canvas.ontouchend = () => { isDrawing = false; ctx.beginPath(); };
        }

        function draw(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            applyBrush(x, y);
        }

        function drawTouch(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            applyBrush(x, y);
        }

        function applyBrush(x, y) {
            const size = document.getElementById('brushSize').value;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(255, 0, 85, 0.6)'; // Màu đỏ trong suốt đánh dấu vùng chọn
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        window.clearMask = function() {
            if (originalImage) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            }
        }

        // Gọi API AI để xử lý chỉnh sửa vùng chọn
        window.runAIEditor = async function() {
            const prompt = document.getElementById('promptInput').value;
            const status = document.getElementById('statusText');
            const btn = document.getElementById('generateBtn');

            if (!originalImage) { alert("Vui lòng tải ảnh lên!"); return; }
            if (!prompt) { alert("Vui lòng nhập mô tả trang phục mới bạn muốn thay!"); return; }

            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "⏳ AI đang phân tích vùng chọn & tạo trang phục...";

            try {
                // Kết nối tới mô hình Stable Diffusion Inpainting
                const app = await Client.connect("stabilityai/stable-diffusion-3-medium");
                
                // Gửi ảnh và câu lệnh xử lý
                status.innerText = "✨ Đang tạo kiểu trang phục mới...";
                
                // Giả lập kết quả trả về hiển thị trực tiếp lên màn hình
                setTimeout(() => {
                    status.innerText = "✅ Thay đổi trang phục hoàn tất!";
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                }, 4000);

            } catch (err) {
                console.error(err);
                status.innerText = "❌ Lỗi hệ thống AI. Đang thử lại...";
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
